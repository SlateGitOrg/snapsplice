[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapsplice"
version = "0.1.0"
description = "Lock-free CDC backfill: chunked snapshots spliced into the change log by low/high watermarks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "snapsplice contributors" }]
dependencies = ["duckdb>=1.1", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[project.scripts]
snapsplice = "snapsplice.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/snapsplice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
